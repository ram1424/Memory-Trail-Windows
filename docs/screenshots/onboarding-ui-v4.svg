<svg xmlns="http://www.w3.org/2000/svg" width="920" height="680" viewBox="0 0 920 680">
  <defs><linearGradient id="tourbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D3DEEC"/><stop offset=".58" stop-color="#C2D0E2"/><stop offset="1" stop-color="#B3C4DA"/></linearGradient><linearGradient id="selected" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2095FF"/><stop offset=".55" stop-color="#126EFF"/><stop offset="1" stop-color="#5B62F6"/></linearGradient></defs>
  <rect x="0" y="0" width="920" height="680" rx="0" fill="url(#tourbg)" stroke="none" stroke-width="1" /><rect x="20" y="20" width="880" height="640" rx="24" fill="#DCE6F2" stroke="#B2C2D5" stroke-width="1" />
  <text x="42" y="45" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#40506A" text-anchor="start" dominant-baseline="middle">5 of 6</text><text x="878" y="45" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#66778F" text-anchor="end" dominant-baseline="middle">Privacy &amp; Controls</text>
  <rect x="80" y="78" width="92" height="26" rx="12" fill="#DCEBFF" stroke="#B8D2F5" stroke-width="1" /><text x="94" y="91" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#176DFF" text-anchor="start" dominant-baseline="middle">◆</text><text x="113" y="91" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#176DFF" text-anchor="start" dominant-baseline="middle">PRIVACY</text>
  <text x="80" y="132" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Privacy-first by design</text>
  <text x="80" y="163" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#40506A" text-anchor="start" dominant-baseline="middle">Memory Trail is a private, locally run Windows app. Captured activity history is processed and stored on this PC.</text>
  <rect x="80" y="190" width="760" height="338" rx="20" fill="#E6EDF5" stroke="#BAC9DA" stroke-width="1" />
  <rect x="98" y="210" width="38" height="38" rx="11" fill="#FFF6D8" stroke="#EEB11455" stroke-width="1" /><text x="117" y="229.5" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="17.48" font-weight="700" fill="#EEB114" text-anchor="middle" dominant-baseline="middle">▰</text><text x="150" y="222" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Sourced and stored locally</text><text x="150" y="244" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">Timeline data comes from local Windows app and window context, local files and paths,</text><text x="150" y="261" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">and the clipboard when enabled. Captured history is stored locally on this PC.</text><line x1="150" y1="279" x2="820" y2="279" stroke="#C6D3E2" stroke-width="1"/><rect x="98" y="288" width="38" height="38" rx="11" fill="#E7F1FF" stroke="#3089F155" stroke-width="1" /><text x="117" y="307.5" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="17.48" font-weight="700" fill="#3089F1" text-anchor="middle" dominant-baseline="middle">▣</text><text x="150" y="300" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">No captured-data transmission</text><text x="150" y="322" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">Memory Trail does not upload, sync, or send your captured timeline data outside of this computer.</text><line x1="150" y1="357" x2="820" y2="357" stroke="#C6D3E2" stroke-width="1"/><rect x="98" y="366" width="38" height="38" rx="11" fill="#E2F6FF" stroke="#1CAEE855" stroke-width="1" /><text x="117" y="385.5" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="17.48" font-weight="700" fill="#1CAEE8" text-anchor="middle" dominant-baseline="middle">◎</text><text x="150" y="378" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">No external data connectors</text><text x="150" y="400" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">Memory Trail does not use cloud sync, analytics services, remote accounts, or external data connectors</text><text x="150" y="417" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">for its capture and storage workflow.</text><line x1="150" y1="435" x2="820" y2="435" stroke="#C6D3E2" stroke-width="1"/><rect x="98" y="444" width="38" height="38" rx="11" fill="#FFEFD8" stroke="#F28B1855" stroke-width="1" /><text x="117" y="463.5" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="9.12" font-weight="700" fill="#F28B18" text-anchor="middle" dominant-baseline="middle">&lt;/&gt;</text><text x="150" y="456" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Verifiable source code</text><text x="150" y="478" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="11.3" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">The source code is available for review so you can verify how Memory Trail captures, processes, and stores data.</text><rect x="80" y="542" width="760" height="54" rx="14" fill="#D7E8FB" stroke="#B7CDE8" stroke-width="1" /><text x="100" y="569" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#176DFF" text-anchor="start" dominant-baseline="middle">✓</text><text x="124" y="560" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Your history stays on this PC.</text><text x="124" y="578" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="10.8" font-weight="400" fill="#52647D" text-anchor="start" dominant-baseline="middle">Private by default. Local by design. You remain in control of capture, clipboard history, and exclusions.</text><rect x="42" y="602" width="112" height="40" rx="12" fill="#EAF0F6" stroke="#DCE5F0" stroke-width="1" /><text x="98" y="622" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#40506A" text-anchor="middle" dominant-baseline="middle">Back</text><rect x="734" y="602" width="144" height="40" rx="12" fill="url(#selected)" stroke="#126EFF" stroke-width="1" /><text x="806" y="622" font-family="Segoe UI Variable Text,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Continue →</text><circle cx="426" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="442" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="458" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="474" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="490" cy="622" r="4" fill="#1680FF"/><circle cx="506" cy="622" r="3.5" fill="#BDC9D9"/></svg>