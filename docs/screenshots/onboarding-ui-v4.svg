<svg xmlns="http://www.w3.org/2000/svg" width="920" height="680" viewBox="0 0 920 680"><defs>
 <linearGradient id="mainbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3EAF3"/><stop offset="1" stop-color="#CCD9E8"/></linearGradient>
 <linearGradient id="sidebg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DFE7F1"/><stop offset="1" stop-color="#C8D6E7"/></linearGradient>
 <linearGradient id="sel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1480FF"/><stop offset="1" stop-color="#336EF2"/></linearGradient>
 <linearGradient id="prim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2095FF"/><stop offset=".55" stop-color="#126EFF"/><stop offset="1" stop-color="#5B62F6"/></linearGradient>
 <linearGradient id="rightbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DEE7F1"/><stop offset="1" stop-color="#CFDCEA"/></linearGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#40516A" flood-opacity=".13"/></filter>
 </defs>
 <linearGradient id="tourbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D3DEEC"/><stop offset=".58" stop-color="#C2D0E2"/><stop offset="1" stop-color="#B3C4DA"/></linearGradient>
 <rect x="0" y="0" width="920" height="680" rx="0" fill="url(#tourbg)" stroke="none" stroke-width="0"/><rect x="20" y="20" width="880" height="640" rx="24" fill="#DCE6F2" stroke="#B2C2D5" stroke-width="1"/>
 <text x="42" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#40506A" text-anchor="start" dominant-baseline="middle">5 of 6</text><text x="878" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#66778F" text-anchor="end" dominant-baseline="middle">Privacy &amp; Controls</text><rect x="80" y="78" width="88" height="26" rx="12" fill="#DCEBFF" stroke="#B8D2F5" stroke-width="1"/><text x="95" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#176DFF" text-anchor="start" dominant-baseline="middle">&#9679;</text><text x="114" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#176DFF" text-anchor="start" dominant-baseline="middle">PRIVACY</text><text x="80" y="130" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Privacy-first by design</text><text x="80" y="160" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#40506A" text-anchor="start" dominant-baseline="middle">Memory Trail is a private, locally run Windows app. Captured activity history is processed and stored on this PC.</text><rect x="80" y="190" width="760" height="320" rx="20" fill="#E6EDF5" stroke="#BAC9DA" stroke-width="1"/><rect x="98" y="214" width="38" height="38" rx="11.4" fill="#FFF6D8" stroke="#EEB11455" stroke-width="1"/><path d="M 106.36 227.68 h 7.6000000000000005 l 2.66 3.04 h 11.4 v 10.64 h -21.659999999999997 z" fill="#EEB114"/><text x="150" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Sourced and stored locally</text><text x="150" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">Timeline data comes from local Windows app and window context, local files and paths, and the clipboard when enabled.</text><line x1="150" y1="272" x2="820" y2="272" stroke="#C6D3E2" stroke-width="1"/><rect x="98" y="287" width="38" height="38" rx="11.4" fill="#E7F1FF" stroke="#3089F155" stroke-width="1"/><rect x="109.78" y="298.4" width="14.44" height="17.48" rx="1.9000000000000001" fill="none" stroke="#3089F1" stroke-width="1.9000000000000001"/><rect x="113.2" y="295.36" width="7.6000000000000005" height="4.94" rx="1.52" fill="#E7F1FF" stroke="#3089F1" stroke-width="1.9000000000000001"/><text x="150" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">No captured-data transmission</text><text x="150" y="321" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">Memory Trail does not upload, sync, or send your captured timeline data outside of this computer.</text><line x1="150" y1="345" x2="820" y2="345" stroke="#C6D3E2" stroke-width="1"/><rect x="98" y="360" width="38" height="38" rx="11.4" fill="#E2F6FF" stroke="#1CAEE855" stroke-width="1"/><circle cx="117" cy="379" r="8.36" fill="none" stroke="#1CAEE8" stroke-width="2.09"/><line x1="108.64" y1="379" x2="125.36" y2="379" stroke="#1CAEE8" stroke-width="1.71"/><ellipse cx="117" cy="379" rx="3.8000000000000003" ry="8.36" fill="none" stroke="#1CAEE8" stroke-width="1.71"/><text x="150" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">No external data connectors</text><text x="150" y="394" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">Memory Trail does not use cloud sync, analytics services, remote accounts, or external data connectors for capture and storage.</text><line x1="150" y1="418" x2="820" y2="418" stroke="#C6D3E2" stroke-width="1"/><rect x="98" y="433" width="38" height="38" rx="11.4" fill="#FFEFD8" stroke="#F28B1855" stroke-width="1"/><text x="117" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="9.12" font-weight="700" fill="#F28B18" text-anchor="middle" dominant-baseline="middle">&lt;/&gt;</text><text x="150" y="445" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Verifiable source code</text><text x="150" y="467" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#66778F" text-anchor="start" dominant-baseline="middle">The source code is available for review so you can verify how Memory Trail captures, processes, and stores data.</text><rect x="80" y="524" width="760" height="54" rx="14" fill="#D7E8FB" stroke="#B7CDE8" stroke-width="1"/><text x="100" y="551" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#176DFF" text-anchor="start" dominant-baseline="middle">&#10003;</text><text x="124" y="542" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#1A2438" text-anchor="start" dominant-baseline="middle">Your history stays on this PC.</text><text x="124" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="10.8" font-weight="400" fill="#52647D" text-anchor="start" dominant-baseline="middle">Private by default. Local by design. You remain in control of capture, clipboard history, and exclusions.</text><rect x="42" y="602" width="112" height="40" rx="12" fill="#EAF0F6" stroke="#DCE5F0" stroke-width="1"/><text x="98" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#40506A" text-anchor="middle" dominant-baseline="middle">Back</text><rect x="734" y="602" width="144" height="40" rx="12" fill="url(#prim)" stroke="#126EFF" stroke-width="1"/><text x="806" y="622" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Continue &gt;</text><circle cx="426" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="442" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="458" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="474" cy="622" r="3.5" fill="#BDC9D9"/><circle cx="490" cy="622" r="4" fill="#1680FF"/><circle cx="506" cy="622" r="3.5" fill="#BDC9D9"/></svg>