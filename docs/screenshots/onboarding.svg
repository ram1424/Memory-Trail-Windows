<text x="112" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" fill="#172238" text-anchor="start">Welcome to Memory Trail</text>
<text x="112" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#40506A" text-anchor="start">Your activity timeline. Private. Local. Yours.</text>
<text x="112" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#66778F" text-anchor="start">Memory Trail quietly builds a searchable history of the apps</text>
<text x="112" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#66778F" text-anchor="start">and windows you use so you can find your way back.</text>
