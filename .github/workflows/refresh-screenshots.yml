name: Refresh UI screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ScreenshotExporter.cs'
      - 'App.xaml.cs'
      - 'App.xaml'
      - 'MainWindow.xaml'
      - 'MainWindow.xaml.cs'
      - 'OnboardingWindow.xaml'
      - 'OnboardingWindow.xaml.cs'
      - 'CategoryIcon.cs'
      - 'Services/AppIconConverter.cs'
      - 'Services/Branding.cs'
      - 'Assets/**'
      - '.github/workflows/refresh-screenshots.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\MemoryTrail.Windows.csproj

      - name: Render screenshots from the actual WPF UI
        shell: pwsh
        env:
          MEMORY_TRAIL_EXPORT_SCREENSHOTS: '1'
          MEMORY_TRAIL_SCREENSHOT_DIR: '${{ github.workspace }}\docs\screenshots'
        run: dotnet run --project .\MemoryTrail.Windows.csproj -c Release

      - name: Verify screenshot files
        shell: pwsh
        run: |
          $files = @(
            'docs/screenshots/today-ui.png',
            'docs/screenshots/ask-memory-trail-ui.png',
            'docs/screenshots/privacy-settings-ui.png',
            'docs/screenshots/onboarding-privacy-ui.png'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing screenshot: $file" }
          }

      - name: Point README at the rendered PNG screenshots
        shell: pwsh
        run: |
          $path = 'README.md'
          $content = Get-Content $path -Raw
          $content = $content.Replace('docs/screenshots/today-ui-v4.svg', 'docs/screenshots/today-ui.png')
          $content = $content.Replace('docs/screenshots/ask-memory-trail-ui-v4.svg', 'docs/screenshots/ask-memory-trail-ui.png')
          $content = $content.Replace('docs/screenshots/privacy-settings-ui-v4.svg', 'docs/screenshots/privacy-settings-ui.png')
          $content = $content.Replace('docs/screenshots/onboarding-ui-v4.svg', 'docs/screenshots/onboarding-privacy-ui.png')
          Set-Content -Path $path -Value $content -Encoding utf8

      - name: Commit rendered screenshots
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/screenshots/*.png
          if (git diff --cached --quiet) {
            Write-Host 'Screenshots are already current.'
            exit 0
          }
          git commit -m 'Render README screenshots from current WPF UI'
          git push
