name: Build Microsoft Store MSIX

on:
  push:
    branches: [main]
    paths:
      - "Packaging/MSIX/**"
      - "Tools/Packaging/**"
      - "Services/AppVersion.cs"
      - "Views/MainWindow.xaml.cs"
      - "App.xaml.cs"
      - "Services/UpdateService.cs"
      - "MemoryTrail.Windows.csproj"
      - ".github/workflows/build-msix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tooling
        run: python -m pip install pillow
      - name: Resolve Partner Center identity and version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "MemoryTrail.Windows.csproj"
          $displayVersion = [string]$project.Project.PropertyGroup.DisplayVersion
          $msixVersion = "$displayVersion.0"

          $identity = Get-Content "Packaging/MSIX/StoreIdentity.json" -Raw | ConvertFrom-Json
          $packageName = [string]$identity.PackageIdentityName
          $publisher = [string]$identity.PackageIdentityPublisher
          $publisherDisplayName = [string]$identity.PublisherDisplayName

          if ([string]::IsNullOrWhiteSpace($packageName) -or
              [string]::IsNullOrWhiteSpace($publisher) -or
              [string]::IsNullOrWhiteSpace($publisherDisplayName)) {
            throw "Partner Center Store identity is incomplete."
          }

          "DISPLAY_VERSION=$displayVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSIX_VERSION=$msixVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_NAME=$packageName" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISHER=$publisher" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PUBLISHER_DISPLAY_NAME=$publisherDisplayName" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSIX_NAME=Memory-Trail-$displayVersion-x64.msix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Restore
        run: dotnet restore MemoryTrail.Windows.csproj -r win-x64
      - name: Publish Microsoft Store build
        shell: pwsh
        run: |
          $args = @("publish","MemoryTrail.Windows.csproj","-c","Release","-r","win-x64","--self-contained","true","--no-restore","-p:Version=$env:DISPLAY_VERSION","-p:AssemblyVersion=$env:MSIX_VERSION","-p:FileVersion=$env:MSIX_VERSION","-p:InformationalVersion=$env:DISPLAY_VERSION","-p:BuildCommit=$env:GITHUB_SHA","-p:DistributionChannel=MicrosoftStore","-p:PublishSingleFile=true","-p:IncludeNativeLibrariesForSelfExtract=true","-p:EnableCompressionInSingleFile=true","-o","artifacts/store-publish")
          & dotnet @args
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
      - name: Build MSIX
        shell: pwsh
        run: |
          ./Tools/Packaging/build-msix.ps1 -SourceDirectory "artifacts/store-publish" -OutputPath "artifacts/$env:MSIX_NAME" -PackageName "$env:PACKAGE_NAME" -Publisher "$env:PUBLISHER" -PublisherDisplayName "$env:PUBLISHER_DISPLAY_NAME" -Version "$env:MSIX_VERSION" -RepositoryRoot "$PWD"
      - name: Verify Store manifest identity
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "artifacts/msix-staging/AppxManifest.xml"
          $ns = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $ns.AddNamespace("m", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")

          $identity = $manifest.SelectSingleNode("/m:Package/m:Identity", $ns)
          $properties = $manifest.SelectSingleNode("/m:Package/m:Properties", $ns)

          if ($identity.Name -ne $env:PACKAGE_NAME) {
            throw "MSIX Identity Name mismatch: $($identity.Name)"
          }
          if ($identity.Publisher -ne $env:PUBLISHER) {
            throw "MSIX Publisher mismatch: $($identity.Publisher)"
          }
          if ($properties.PublisherDisplayName -ne $env:PUBLISHER_DISPLAY_NAME) {
            throw "MSIX PublisherDisplayName mismatch: $($properties.PublisherDisplayName)"
          }
          if ($identity.Version -ne $env:MSIX_VERSION) {
            throw "MSIX version mismatch: $($identity.Version)"
          }

          Write-Host "Verified Microsoft Store identity:"
          Write-Host "  Name: $($identity.Name)"
          Write-Host "  Publisher: $($identity.Publisher)"
          Write-Host "  PublisherDisplayName: $($properties.PublisherDisplayName)"
          Write-Host "  Version: $($identity.Version)"

      - name: Upload MSIX workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MSIX_NAME }}
          path: artifacts/${{ env.MSIX_NAME }}

      - name: Wait for matching 1.0.5 release and attach Store MSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:DISPLAY_VERSION"
          $matched = $false

          for ($attempt = 1; $attempt -le 36; $attempt++) {
            try {
              $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" | ConvertFrom-Json
              $tagSha = [string]$ref.object.sha

              if ($tagSha -eq $env:GITHUB_SHA) {
                $matched = $true
                break
              }

              Write-Host "Release tag exists but points to $tagSha; waiting for current build $env:GITHUB_SHA."
            }
            catch {
              Write-Host "Release tag $tag is not ready yet."
            }

            Start-Sleep -Seconds 10
          }

          if (-not $matched) {
            throw "Timed out waiting for $tag to point to this commit."
          }

          gh release upload "$tag" "artifacts/$env:MSIX_NAME" --clobber
          Write-Host "Attached $env:MSIX_NAME to $tag."
