name: Release Memory Trail

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve semantic patch version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content "MemoryTrail.Windows.csproj"
          $sourceVersion = [string]$project.Project.PropertyGroup.DisplayVersion
          $commitTitle = git log -1 --pretty=%s
          $keepCurrentVersion = $commitTitle -match '\[keep-version\]'

          if ($keepCurrentVersion) {
            $displayVersion = $sourceVersion
            Write-Host "Keeping current release version $displayVersion for this push."
          }
          elseif ("$env:GITHUB_EVENT_NAME" -eq "push") {
            $highestPatch = -1

            try {
              $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
              $releases = $releasesJson | ConvertFrom-Json

              foreach ($release in $releases) {
                $tag = [string]$release.tag_name

                if ($tag -match '^v?1\.0\.(\d+)$') {
                  $patch = [int]$Matches[1]
                  if ($patch -gt $highestPatch) { $highestPatch = $patch }
                  continue
                }

                if ($tag -match '^v?1(?:\.0(?:\.0)?)?$') {
                  if (0 -gt $highestPatch) { $highestPatch = 0 }
                }
              }
            }
            catch {
              Write-Host "Could not read existing releases; using source baseline."
            }

            if ($highestPatch -lt 0) {
              $displayVersion = $sourceVersion
            }
            else {
              $displayVersion = "1.0.$($highestPatch + 1)"
            }

            if ([version]$displayVersion -lt [version]"1.0.1") {
              $displayVersion = "1.0.1"
            }
          }
          else {
            $displayVersion = $sourceVersion
          }

          $assemblyVersion = "$displayVersion.0"
          $releaseTag = "v$displayVersion"
          $releaseName = "Memory Trail Version $displayVersion"
          $artifactName = "Memory-Trail-Windows-$displayVersion-x64.zip"

          "DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSEMBLY_VERSION=$assemblyVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Building $releaseName"

      - name: Build standards-compliant Windows icon
        shell: pwsh
        run: |
          python Tools/Icons/generate_windows_icon.py .

          $pngRequired = @(
            "Assets/MemoryTrailIcon.png",
            "Assets/MemoryTrailIconMaster.png",
            "Assets/OnboardingIcon.png"
          )
          foreach ($path in $pngRequired) {
            if (-not (Test-Path $path)) { throw "Required branding asset is missing: $path" }
            if ((Get-Item $path).Length -lt 10000) { throw "Branding PNG is incomplete: $path" }
          }

          $ico = "Assets/MemoryTrailApp.ico"
          if (-not (Test-Path $ico)) { throw "Required Windows icon is missing: $ico" }
          if ((Get-Item $ico).Length -lt 1024) { throw "Windows icon file is unexpectedly small: $ico" }

      - name: Restore
        run: dotnet restore MemoryTrail.Windows.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: |
          dotnet build MemoryTrail.Windows.csproj -c Release -r win-x64 --no-restore `
            -p:Version=$env:DISPLAY_VERSION `
            -p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            -p:FileVersion=$env:ASSEMBLY_VERSION `
            -p:InformationalVersion=$env:DISPLAY_VERSION

      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: |
          dotnet publish MemoryTrail.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=$env:DISPLAY_VERSION `
            -p:AssemblyVersion=$env:ASSEMBLY_VERSION `
            -p:FileVersion=$env:ASSEMBLY_VERSION `
            -p:InformationalVersion=$env:DISPLAY_VERSION `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o artifacts/Memory-Trail-Windows-x64

      - name: Verify published application
        shell: pwsh
        run: |
          $exe = "artifacts/Memory-Trail-Windows-x64/Memory Trail.exe"
          if (-not (Test-Path $exe)) { throw "Published executable was not created: $exe" }
          Write-Host "Published $((Get-Item $exe).Length) byte executable."

      - name: Zip build
        shell: pwsh
        run: |
          $zip = "artifacts/$env:ARTIFACT_NAME"
          Compress-Archive -Path "artifacts/Memory-Trail-Windows-x64/*" -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}

      - name: Prepare release notes
        shell: pwsh
        run: |
          $commitTitle = git log -1 --pretty=%s
          $generated = "artifacts/RELEASE_NOTES.generated.md"

          @(
            "# Memory Trail Version $env:DISPLAY_VERSION"
            ""
            "## Changes in this release"
            ""
            "- $commitTitle"
            ""
          ) | Set-Content -Path $generated -Encoding utf8

          Get-Content "docs/RELEASE_NOTES.md" | Add-Content -Path $generated -Encoding utf8
          "RELEASE_NOTES_PATH=$generated" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Remove superseded GitHub releases and tags
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $releases = $releasesJson | ConvertFrom-Json

          foreach ($release in $releases) {
            Write-Host "Removing superseded release: $($release.tag_name)"
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"

            try {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$($release.tag_name)"
            }
            catch {
              Write-Host "Tag $($release.tag_name) was already absent or could not be removed."
            }
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          name: ${{ env.RELEASE_NAME }}
          make_latest: true
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: artifacts/${{ env.ARTIFACT_NAME }}
