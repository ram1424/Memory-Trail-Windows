name: Build and Release Memory Trail for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "MemoryTrail.Windows.csproj"
          $displayVersion = [string]$project.Project.PropertyGroup.DisplayVersion
          $buildNumber = [string]$project.Project.PropertyGroup.BuildNumber
          $releaseTag = "v$displayVersion-build.$buildNumber"
          $releaseName = "Memory Trail $displayVersion (Build $buildNumber)"
          $artifactName = "Memory-Trail-Windows-$displayVersion-build-$buildNumber-x64.zip"

          "DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_NUMBER=$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Building $releaseName"

      - name: Build standards-compliant Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python Scripts/generate_windows_icon.py .

          $pngRequired = @(
            "Assets/MemoryTrailIcon.png",
            "Assets/MemoryTrailIconMaster.png",
            "Assets/OnboardingIcon.png"
          )
          foreach ($path in $pngRequired) {
            if (-not (Test-Path $path)) { throw "Required branding asset is missing: $path" }
            if ((Get-Item $path).Length -lt 10000) { throw "Branding PNG is incomplete: $path" }
          }

          $ico = "Assets/MemoryTrailApp.ico"
          if (-not (Test-Path $ico)) { throw "Required Windows icon is missing: $ico" }
          if ((Get-Item $ico).Length -lt 1024) { throw "Windows icon file is unexpectedly small: $ico" }

      - name: Restore
        run: dotnet restore MemoryTrail.Windows.csproj -r win-x64

      - name: Build
        run: dotnet build MemoryTrail.Windows.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish MemoryTrail.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/Memory-Trail-Windows-x64

      - name: Verify published application
        shell: pwsh
        run: |
          $exe = "artifacts/Memory-Trail-Windows-x64/Memory Trail.exe"
          if (-not (Test-Path $exe)) { throw "Published executable was not created: $exe" }
          Write-Host "Published $((Get-Item $exe).Length) byte executable."

      - name: Zip build
        shell: pwsh
        run: |
          $zip = "artifacts/$env:ARTIFACT_NAME"
          Compress-Archive -Path "artifacts/Memory-Trail-Windows-x64/*" -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}

      - name: Remove superseded GitHub releases and tags
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $releases = $releasesJson | ConvertFrom-Json

          foreach ($release in $releases) {
            Write-Host "Removing superseded release: $($release.tag_name)"
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"

            try {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$($release.tag_name)"
            }
            catch {
              Write-Host "Tag $($release.tag_name) was already absent or could not be removed."
            }
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: main
          name: ${{ env.RELEASE_NAME }}
          make_latest: true
          body: |
            # Memory Trail 1.0 (Build 1)

            A private, local-first Windows activity timeline with a polished Soft Blue interface.

            ## Highlights
            - Hardened Windows activity capture using foreground-window events plus polling fallback
            - Automatic capture-service recovery and app-level fallback events when window titles are unavailable
            - Newest-first Today timeline with Live Activity state and session-based active time
            - Ask Memory Trail for local website, email, conversation, file, app, and time-aware searches
            - Favorites, Clipboard History, manual memories, Insights, filters, and activity details
            - Polished loading screen, tutorial, dimensional filter icons, and Hide/Show Panels control
            - Windows tray operation and optional Start with Windows
            - Self-contained Windows x64 build; no separate .NET installation required

            ## Privacy
            - Timeline data is stored locally under %LOCALAPPDATA%\Memory Trail
            - No Memory Trail account is required
            - No captured timeline history is uploaded or synchronized by the app
            - No analytics or advertising SDK is included
            - No external connector is required for capture, storage, display, or Ask Memory Trail
            - App Activity and Clipboard capture can be disabled independently
            - Capture can be paused at any time
            - Process exclusions are supported
            - CredentialUIBroker, 1Password, and Bitwarden are excluded by default
            - Memory Trail does not record the screen and is not a keylogger
            - Source code and full privacy details are available in this repository

            See PRIVACY.md for the full privacy and data-handling description.
          files: artifacts/${{ env.ARTIFACT_NAME }}
