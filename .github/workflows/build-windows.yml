name: Build and Release Memory Lane Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MemoryLane.Windows.csproj

      - name: Build
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet build MemoryLane.Windows.csproj -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report compiler failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Get-Content build.log -Raw
          if ($log.Length -gt 60000) { $log = $log.Substring($log.Length - 60000) }
          $body = "Automated Windows build failed on commit ${{ github.sha }}.`n`n```text`n$log`n```"
          gh issue create --title "Windows build failure - ${{ github.run_number }}" --body $body

      - name: Stop after build failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Publish self-contained Windows x64 app
        run: dotnet publish MemoryLane.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/Memory-Lane-Windows-x64

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path "artifacts/Memory-Lane-Windows-x64/*" -DestinationPath "artifacts/Memory-Lane-Windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memory-Lane-Windows-x64
          path: artifacts/Memory-Lane-Windows-x64.zip

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Memory Lane for Windows v0.1.0
          body: |
            First Windows release of Memory Lane.

            Includes:
            - Activity timeline and focused-window tracking
            - Search, Favorites, and Add Memory
            - Optional clipboard capture
            - Privacy exclusions and pause/resume controls
            - Windows system tray support
            - First-launch tutorial
            - Start-with-Windows option
            - Local-only storage
          files: artifacts/Memory-Lane-Windows-x64.zip
