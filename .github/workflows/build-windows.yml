name: Build and Release Memory Trail for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "MemoryTrail.Windows.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building Memory Trail for Windows v$version"

      - name: Verify committed Memory Trail branding assets
        shell: pwsh
        run: |
          $required = @(
            "Assets/MemoryTrailApp.ico",
            "Assets/MemoryTrailIconMaster.png"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required branding asset is missing: $path" }
            if ((Get-Item $path).Length -lt 10000) { throw "Branding asset is incomplete: $path" }
          }

      - name: Restore
        run: dotnet restore MemoryTrail.Windows.csproj -r win-x64

      - name: Build
        run: dotnet build MemoryTrail.Windows.csproj -c Release -r win-x64 --no-restore

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish MemoryTrail.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifacts/Memory-Trail-Windows-x64

      - name: Verify published application
        shell: pwsh
        run: |
          $exe = "artifacts/Memory-Trail-Windows-x64/Memory Trail.exe"
          if (-not (Test-Path $exe)) { throw "Published executable was not created: $exe" }
          Write-Host "Published $((Get-Item $exe).Length) byte executable."

      - name: Zip build
        shell: pwsh
        run: |
          $zip = "artifacts/Memory-Trail-Windows-v$env:VERSION-x64.zip"
          Compress-Archive -Path "artifacts/Memory-Trail-Windows-x64/*" -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memory-Trail-Windows-v${{ env.VERSION }}-x64
          path: artifacts/Memory-Trail-Windows-v${{ env.VERSION }}-x64.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: Memory Trail for Windows v${{ env.VERSION }}
          body: |
            Memory Trail for Windows v${{ env.VERSION }}

            - Windows-native foreground app and window-title capture
            - Latest-first Today timeline with Live Activity state
            - Correct session-based active-time calculation
            - Dynamic filters that appear only when matching activity exists
            - Ask Memory Trail with app-aware website, email, conversation, file, and time searches
            - Double-click or press Enter on Ask results to open complete activity details
            - Installed-app privacy picker plus manual process exclusions
            - Clipboard history, Favorites, manual memories, tray operation, and startup controls
            - Private local JSON storage with no cloud account, analytics SDK, or external connector
            - Self-contained Windows x64 build; no separate .NET installation required
          files: artifacts/Memory-Trail-Windows-v${{ env.VERSION }}-x64.zip
