name: Build and Release Memory Trail Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MemoryLane.Windows.csproj

      - name: Build
        run: dotnet build MemoryLane.Windows.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64 app
        run: dotnet publish MemoryLane.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/Memory-Trail-Windows-x64

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path "artifacts/Memory-Trail-Windows-x64/*" -DestinationPath "artifacts/Memory-Trail-Windows-v0.3.1-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memory-Trail-Windows-v0.3.1-x64
          path: artifacts/Memory-Trail-Windows-v0.3.1-x64.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          target_commitish: main
          name: Memory Trail for Windows v0.3.1
          body: |
            Polish release with a proper Windows multi-size icon, precisely aligned timeline rows, colorful onboarding visuals, and refined spacing and typography.

            - Activity timeline and focused-window tracking
            - Search, Favorites, and Add Memory
            - Optional clipboard capture
            - Privacy exclusions and pause/resume controls
            - Windows system tray support
            - First-launch tutorial
            - Start-with-Windows option
            - Local-only storage
          files: artifacts/Memory-Trail-Windows-v0.3.1-x64.zip
