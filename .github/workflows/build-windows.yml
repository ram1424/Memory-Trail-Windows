name: Build and Release Memory Lane Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MemoryLane.Windows.csproj

      - name: Build
        id: compile
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet build MemoryLane.Windows.csproj -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report compiler output
        if: steps.compile.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "Automated compiler output for commit ${{ github.sha }}" | Set-Content build-issue.md
          "" | Add-Content build-issue.md
          Get-Content build.log | Add-Content build-issue.md
          gh issue create --title "Build diagnostics ${{ github.run_number }}" --body-file build-issue.md

      - name: Fail after diagnostics
        if: steps.compile.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Publish self-contained Windows x64 app
        run: dotnet publish MemoryLane.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o artifacts/Memory-Lane-Windows-x64

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path "artifacts/Memory-Lane-Windows-x64/*" -DestinationPath "artifacts/Memory-Lane-Windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memory-Lane-Windows-x64
          path: artifacts/Memory-Lane-Windows-x64.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: main
          name: Memory Lane for Windows v0.1.0
          body: |
            First Windows release of Memory Lane.
          files: artifacts/Memory-Lane-Windows-x64.zip
